id: space.rirusha.Cassette.Devel
runtime: org.gnome.Platform
runtime-version: 'master'
sdk: org.gnome.Sdk
command: cassette
finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --socket=wayland
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro
  - --own-name=org.mpris.MediaPlayer2.space.rirusha.Cassette.Devel
modules:
  - name: libdeser
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/rirusha/libdeser.git
        ref: main
  - name: libcase
    buildsystem: meson
    builddir: true
    sources:
      - type: git
        url: https://altlinux.space/rirusha/libcase.git
        tag: v0.2
  - name: cassette
    buildsystem: meson
    builddir: true
    sources:
      - type: dir
        path: ../../
